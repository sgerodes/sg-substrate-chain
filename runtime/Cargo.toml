[package]
name = "sg-solochain-runtime"
description = "A solochain runtime built with Substrate, part of Polkadot Sdk."
version = "0.1.0"
license = "Unlicense"
authors.workspace = true
homepage.workspace = true
repository.workspace = true
edition.workspace = true
publish = false

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
network_constants = { workspace = true }

codec = { features = ["derive"], workspace = true, default-features = false }
frame-benchmarking = { optional = true, workspace = true, default-features = false }
frame-system-benchmarking = { optional = true, workspace = true, default-features = false }
frame-try-runtime = { optional = true, workspace = true, default-features = false }
pallet-template = { workspace = true, default-features = false }
scale-info = { features = ["derive", "serde"], workspace = true, default-features = false }
serde_json = { workspace = true, default-features = false, features = ["alloc"] }

polkadot-sdk = { workspace = true, features = [
	"pallet-aura",
	"pallet-balances",
	"pallet-grandpa",
	"pallet-sudo",
	"pallet-timestamp",
	"pallet-transaction-payment",
	"pallet-transaction-payment-rpc-runtime-api",
	"frame-support",
	"frame-system",
	"runtime",
], default-features = false }

[build-dependencies]
substrate-wasm-builder = { optional = true, workspace = true, default-features = true }

[features]
default = ["std"]
std = [
	"polkadot-sdk/std",
	"codec/std",
	"frame-benchmarking?/std",
	"frame-system-benchmarking?/std",
	"frame-try-runtime?/std",
	"pallet-template/std",
	"scale-info/std",
	"serde_json/std",
	"substrate-wasm-builder",
]

runtime-benchmarks = [
	"frame-benchmarking/runtime-benchmarks",
	"frame-system-benchmarking/runtime-benchmarks",
	"pallet-template/runtime-benchmarks",
	"polkadot-sdk/runtime-benchmarks",
]

try-runtime = [
	"frame-try-runtime/try-runtime",
	"pallet-template/try-runtime",
	"polkadot-sdk/try-runtime",
]

# Enable the metadata hash generation.
#
# This is hidden behind a feature because it increases the compile time.
# The wasm binary needs to be compiled twice, once to fetch the metadata,
# generate the metadata hash and then a second time with the
# `RUNTIME_METADATA_HASH` environment variable set for the `CheckMetadataHash`
# extension.
metadata-hash = ["substrate-wasm-builder/metadata-hash"]

# A convenience feature for enabling things when doing a build
# for an on-chain release.
on-chain-release-build = ["metadata-hash"]
